[project]
name = "fine-tune-creole-models"
version = "0.1.0"
description = "Fine-tuning pipeline for under-resourced Louisiana languages (Cajun French, Kouri-Vini)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/data_contract.py"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/.python-version",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/data_contract.py",
    "/tests/test_data_contract.py",
    "/uv.lock",
]
